{% extends "auth/base.html" %}
{% load i18n static %}
{% block title %}退出登录 - DCRM{% endblock %}

{% block body %}
<body class="hold-transition lockscreen">
<!-- Automatic element centering -->
<div class="lockscreen-wrapper">
  <div class="lockscreen-logo">
    <b>DC</b>RM
  </div>
  <!-- User name -->
  <div class="lockscreen-name">DCRM</div>
  <!-- START LOCK SCREEN ITEM -->
  <div class="lockscreen-item">
    <!-- lockscreen image -->
    <div class="lockscreen-image">
      <img src="{% static 'dcrm/img/default.png' %}" alt="User Image">
    </div>
    <form class="lockscreen-credentials" action="" method="post">
      <div class="input-group">
        <input type="text" class="form-control" disabled="disabled" autocomplete="off"  placeholder="{%now 'Ymd'%}">

      </div>
    </form>
  </div>
  <div class="text-center">
    <a href="{% url 'login' %}">{% trans 'Log in again' %}</a>
  </div>
  <div class="lockscreen-footer text-center">
    <p>{% trans "感谢您今天花大量时间浏览本网站。" %}</p><br>
    Copyright &copy; 2016 <b>DCRM</b><br>
    All rights reserved
  </div>
</div>
<!-- /.center -->
</body>
{% endblock %}
