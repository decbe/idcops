{% extends "base.html" %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h3 class="card-title">重置密码</h3>
  </div>
  <div class="card-body">
    <p>请输入您的邮箱地址，我们将发送密码重置链接到您的邮箱。</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">发送重置邮件</button>
    </form>
  </div>
</div>
{% endblock %}
