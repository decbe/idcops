{% extends "base.html" %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h3 class="card-title">修改密码</h3>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">确认修改</button>
    </form>
  </div>
</div>
{% endblock %}
