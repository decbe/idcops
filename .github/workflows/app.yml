name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # SECRET_KEY should be stored in repository secrets (Settings → Secrets → Actions)
  SECRET_KEY: ${{ secrets.SECRET_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: python:${{ matrix.python-version }}-slim
      options: --user root
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dcrm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Show Python version
        run: |
          python --version

      - name: Ensure SECRET_KEY is set
        run: |
          if [ -z "$SECRET_KEY" ]; then
            echo "ERROR: SECRET_KEY is not set. Please add it to repository secrets: Settings → Secrets → Actions → New repository secret named SECRET_KEY"
            exit 1
          fi

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps (minimal + retries)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # reduce packages to the minimal set required for building C extensions
          apt-get update -o Acquire::Retries=3
          for i in 1 2 3; do
            apt-get install -y --no-install-recommends \
              curl \
              ca-certificates \
              postgresql-client \
              build-essential \
              libpq-dev \
              pkg-config \
              python3-dev \
              libssl-dev \
              libffi-dev \
              zlib1g-dev \
              libjpeg62-turbo-dev \
              libfreetype6-dev \
              liblcms2-dev \
              libopenjp2-7-dev \
              libtiff-dev \
              libharfbuzz-dev \
              libfribidi-dev \
              redis-tools && break || {
                echo "apt-get install failed, retrying ($i)";
                sleep 5;
                apt-get update -o Acquire::Retries=3;
              }
          done
          rm -rf /var/lib/apt/lists/* && apt-get clean

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # prefer wheels (binary distributions) to avoid building C extensions from source when possible
          pip install --prefer-binary -r requirements.txt

      - name: Wait for Postgres
        env:
          PGPASSWORD: postgres
        run: |
          for i in {1..15}; do
            if psql -h postgres -U postgres -c '\\l' >/dev/null 2>&1; then
              echo "Postgres is ready"
              break
            else
              echo "Waiting for Postgres... ($i)"
              sleep 2
            fi
          done

      - name: Wait for Redis
        run: |
          for i in {1..15}; do
            if redis-cli -h redis ping >/dev/null 2>&1; then
              echo "Redis is ready"
              break
            else
              echo "Waiting for Redis... ($i)"
              sleep 2
            fi
          done

      - name: Run migrations
        env:
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        env:
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          REDIS_HOST: redis
          REDIS_PORT: 6379
          DEBUG: "1"
          ISOLATED_DEPLOYMENT: "1"
          CENSUS_REPORTING_ENABLED: "0"
        run: |
          python manage.py test

  lint:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Show Python version
        run: |
          python --version
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8
        run: |
          # only lint project files; adjust paths if necessary
          flake8 . || true